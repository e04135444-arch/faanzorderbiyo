<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faanz Order Bio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        utama: '#10539F',
                        aksen: '#22c55e'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md border-t-4 border-utama">
        <div class="flex justify-center mb-5">
            <div class="w-16 h-16 bg-utama/15 rounded-full flex items-center justify-center">
                <span class="text-utama text-3xl font-bold">FS</span>
            </div>
        </div>

        <h2 class="text-center text-3xl font-bold text-gray-800 mb-3">FAANZ ORDER BIO</h2>
        <p class="text-center text-gray-600 mb-7">
            Silakan tulis pesan atau permintaan kamu di bawah ini ✨
        </p>

        <form id="formPesan" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Pengirim</label>
                <input type="text" id="nama" placeholder="Contoh: Andi / 0812xxxx" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-utama/40" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Masukkan Pesan</label>
                <textarea id="pesan" rows="5" placeholder="Tulis apa yang ingin disampaikan..." class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-utama/40 resize-none" required></textarea>
            </div>

            <button type="submit" id="tombolKirim" class="w-full bg-utama hover:bg-utama/90 text-white font-bold py-3.5 rounded-lg text-lg shadow-md transition">
                🚀 KIRIM
            </button>

            <div id="infoStatus" class="text-center mt-3 font-medium hidden"></div>
        </form>

        <p class="text-center text-xs text-gray-500 mt-6">© 2026 Faanz Store</p>
    </div>

    <script>
        // Data yang sudah kamu berikan
        const TOKEN_BOT = "8833638608:AAEeWjZ2AMud78LXXKNuzrsn6kUXhsyXQps";
        const ID_TUJUAN = "8597220780"; // ID Telegram kamu

        const form = document.getElementById("formPesan");
        const status = document.getElementById("infoStatus");
        const tombol = document.getElementById("tombolKirim");

        form.addEventListener("submit", async function(e) {
            e.preventDefault();
            status.classList.add("hidden");
            tombol.disabled = true;
            tombol.textContent = "⏳ Sedang mengirim...";

            // Ambil apa yang ditulis pengunjung
            const namaPengirim = document.getElementById("nama").value.trim();
            const isiPesan = document.getElementById("pesan").value.trim();

            // Susun format pesan yang masuk ke Telegram
            const teksUntukKirim = 
`📩 PESAN BARU DITERIMA

👤 Nama Pengirim: ${namaPengirim}
💬 Isi Pesan:
${isiPesan}`;

            try {
                // Kirim lewat API bot Telegram
                const res = await fetch(`https://api.telegram.org/bot${TOKEN_BOT}/sendMessage?chat_id=${ID_TUJUAN}&text=${encodeURIComponent(teksUntukKirim)}`);
                const hasil = await res.json();

                if (hasil.ok) {
                    status.textContent = "✅ Pesan berhasil dikirim!";
                    status.className = "text-center mt-3 font-medium text-green-600";
                    form.reset(); // Kosongkan kolom setelah terkirim
                } else {
                    status.textContent = "❌ Gagal mengirim, coba lagi ya!";
                    status.className = "text-center mt-3 font-medium text-red-600";
                }
            } catch (err) {
                status.textContent = "❌ Gangguan jaringan, coba ulangi";
                status.className = "text-center mt-3 font-medium text-red-600";
            }

            status.classList.remove("hidden");
            tombol.disabled = false;
            tombol.textContent = "🚀 KIRIM";
        });
    </script>
</body>
</html>
